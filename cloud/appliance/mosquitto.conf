# Appliance Mosquitto config. SAME TLS + mutual-cert auth as the production
# broker. The custom `mosquitto_acl_file.so` plugin (not in Debian's package) is
# replaced by mosquitto's NATIVE `acl_file` — the .acl files were already in
# native syntax — so per-cert-CN topic ACLs are fully preserved (default-deny).
persistence true
persistence_location /mosquitto/data/

# Per-identity topic ACL (replaces the custom plugin). Global (mosquitto has no
# per-listener acl_file); rules are identity-scoped so this is equivalent. See
# /mosquitto/config/acl.
acl_file /mosquitto/config/acl
log_dest stdout
log_type error
log_type warning
log_type notice
autosave_interval 300
persistent_client_expiration 1d
max_queued_messages 200
max_queued_bytes 10485760

# Device MQTT over TLS. crlfile enforces device-cert revocation: a revoked
# serial (on step-ca's CRL, kept fresh by crl-sync) fails the handshake. Only
# device certs (issued via the helix-device provisioner, which stamps a matching
# CRL distribution point) connect here.
listener 8883
protocol mqtt
allow_anonymous false
require_certificate true
use_identity_as_username true
cafile /mosquitto/certs/root_ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
crlfile /mosquitto/certs/crl.pem
tls_version tlsv1.2

# Service MQTT over TLS. Internal services (helix-server, exporters) with
# long-lived, directly-issued certs — no CRL enforcement here.
listener 8884
protocol mqtt
allow_anonymous false
require_certificate true
use_identity_as_username true
cafile /mosquitto/certs/root_ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# 1 MB message size limit (WebRTC SDP payloads can be large)
message_size_limit 1048576
