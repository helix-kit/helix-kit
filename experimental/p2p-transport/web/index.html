<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helix P2P Transport — experimental</title>
    <style>
      :root { color-scheme: dark; --bg:#0b0f14; --panel:#131a22; --line:#233040; --fg:#e6edf3; --muted:#7d8da0; --accent:#4cc38a; --warn:#e0a458; --bad:#e05252; }
      * { box-sizing: border-box; }
      body { margin:0; font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; background:var(--bg); color:var(--fg); }
      .wrap { max-width:820px; margin:0 auto; padding:28px 20px 60px; }
      h1 { font-size:18px; margin:0 0 4px; }
      .sub { color:var(--muted); margin:0 0 22px; }
      .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
      label { color:var(--muted); font-size:12px; display:block; margin-bottom:4px; }
      input { background:#0b1017; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; font:inherit; width:180px; }
      button { background:var(--accent); color:#04130b; border:0; border-radius:6px; padding:9px 16px; font:inherit; font-weight:600; cursor:pointer; }
      button:disabled { opacity:.45; cursor:default; }
      .row { display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; }
      .kv { display:grid; grid-template-columns:150px 1fr; gap:4px 12px; }
      .kv div:nth-child(odd) { color:var(--muted); }
      .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); }
      .ok { color:var(--accent); border-color:#1f5c40; }
      .warnc { color:var(--warn); border-color:#5c451f; }
      .badc { color:var(--bad); border-color:#5c2020; }
      .bar { height:10px; background:#0b1017; border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-top:6px; }
      .bar > i { display:block; height:100%; width:0; background:var(--accent); transition:width .1s linear; }
      .big { font-size:26px; font-weight:700; }
      .accent { color:var(--accent); }
      .muted { color:var(--muted); }
      #log { white-space:pre-wrap; font-size:12px; color:var(--muted); max-height:180px; overflow:auto; }
      a.dl { color:var(--accent); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Helix P2P Transport <span class="muted">— experimental</span></h1>
      <p class="sub">Direct WebRTC DataChannel to a Linux device. EC2 only brokers the handshake; the file flows peer-to-peer.</p>

      <div class="card">
        <div class="row">
          <div><label for="room">room</label><input id="room" value="demo" /></div>
          <div style="flex:1"><label for="signal">signaling</label><input id="signal" style="width:100%" /></div>
          <button id="connect">Connect</button>
        </div>
      </div>

      <div class="card">
        <div class="kv" id="state">
          <div>signaling</div><div><span id="s-sig" class="pill">idle</span></div>
          <div>peer connection</div><div><span id="s-pc" class="pill">–</span></div>
          <div>ICE</div><div><span id="s-ice" class="pill">–</span></div>
          <div>data channel</div><div><span id="s-dc" class="pill">–</span></div>
          <div>path</div><div><span id="s-path" class="pill">–</span></div>
        </div>
      </div>

      <div class="card">
        <div class="kv">
          <div>file</div><div id="f-name">–</div>
          <div>size</div><div id="f-size">–</div>
          <div>received</div><div id="f-recv">–</div>
        </div>
        <div class="bar"><i id="prog"></i></div>
        <div style="margin-top:14px" class="row">
          <div><div class="muted" style="font-size:12px">throughput</div><div class="big accent" id="rate">– <span style="font-size:14px">MB/s</span></div></div>
          <div><div class="muted" style="font-size:12px">EC2 signaling bytes</div><div class="big" id="sigbytes">–</div></div>
          <div><div class="muted" style="font-size:12px">integrity</div><div class="big" id="sha">–</div></div>
        </div>
        <div id="dlwrap" style="margin-top:12px"></div>
      </div>

      <div class="card"><div id="log"></div></div>
    </div>

    <script type="module">
      const $ = (id) => document.getElementById(id);
      const log = (m) => { const el = $("log"); el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; console.log(m); };
      const fmt = (b) => b < 1024 ? b + " B" : b < 1048576 ? (b/1024).toFixed(1)+" KB" : b < 1073741824 ? (b/1048576).toFixed(2)+" MB" : (b/1073741824).toFixed(2)+" GB";
      const pill = (id, txt, cls) => { const el = $(id); el.textContent = txt; el.className = "pill" + (cls ? " " + cls : ""); };

      // Default the signaling URL to this page's own origin (works both for
      // localhost dev and the EC2 https deploy).
      $("signal").value = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/__p2p__";

      // STUN for direct paths; TURN (our coturn on EC2) as the fallback relay
      // for peers that can't hole-punch — corporate VPNs blocking UDP land on
      // turns:5349 (TLS/TCP, looks like HTTPS). Relayed sessions DO use EC2
      // bandwidth; direct ones don't.
      const STUN = [
        { urls: "stun:stun.l.google.com:19302" },
        {
          urls: [
            "turn:turn.port.helix-kit.com:3478?transport=udp",
            "turn:turn.port.helix-kit.com:3478?transport=tcp",
            "turns:turn.port.helix-kit.com:5349?transport=tcp",
          ],
          username: "helix",
          credential: "helixsecret",
        },
      ];

      let ws, pc, dc;
      let meta = null, received = 0, chunks = [], t0 = 0, statsTimer = 0;

      $("connect").onclick = () => {
        const room = $("room").value.trim() || "demo";
        const signal = $("signal").value.trim();
        $("connect").disabled = true;
        start(signal, room);
      };

      // One-tap mobile flow: open .../?room=xyz and it prefills + auto-connects.
      const qRoom = new URLSearchParams(location.search).get("room");
      if (qRoom) {
        $("room").value = qRoom;
        addEventListener("load", () => $("connect").click());
      }

      function start(signalUrl, room) {
        const url = `${signalUrl}?room=${encodeURIComponent(room)}&role=browser`;
        log(`[signal] connecting ${url}`);
        ws = new WebSocket(url);
        ws.onopen = () => { pill("s-sig", "connected", "ok"); log("[signal] open — waiting for device peer"); pollStats(room, signalUrl); };
        ws.onclose = () => { pill("s-sig", "closed", "warnc"); $("connect").disabled = false; };
        ws.onerror = () => { pill("s-sig", "error", "badc"); log("[signal] error"); };
        ws.onmessage = (ev) => onSignal(JSON.parse(ev.data));
      }

      function sig(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

      async function onSignal(msg) {
        switch (msg.type) {
          case "ready":
            log(`[signal] both peers present (initiator=${msg.initiator}) — the browser answers`);
            setupPeer();
            break;
          case "offer":
            await pc.setRemoteDescription(msg);
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            sig(pc.localDescription);
            log("[webrtc] answer sent");
            break;
          case "candidate":
            try { await pc.addIceCandidate(msg.candidate); } catch (e) { log("[webrtc] addIceCandidate failed: " + e); }
            break;
          case "peer-left":
            log("[signal] device left");
            pill("s-pc", "peer-left", "warnc");
            break;
        }
      }

      function setupPeer() {
        if (pc) return;
        pc = new RTCPeerConnection({ iceServers: STUN });
        pc.onicecandidate = (e) => { if (e.candidate) sig({ type: "candidate", candidate: e.candidate }); };
        pc.onconnectionstatechange = () => pill("s-pc", pc.connectionState, pc.connectionState === "connected" ? "ok" : "");
        pc.oniceconnectionstatechange = () => { pill("s-ice", pc.iceConnectionState, pc.iceConnectionState.includes("connected") || pc.iceConnectionState === "completed" ? "ok" : ""); if (pc.iceConnectionState === "connected" || pc.iceConnectionState === "completed") reportPath(); };
        pc.ondatachannel = (e) => bindChannel(e.channel);
      }

      function bindChannel(channel) {
        dc = channel;
        dc.binaryType = "arraybuffer";
        dc.onopen = () => { pill("s-dc", "open", "ok"); log("[webrtc] data channel open"); };
        dc.onclose = () => pill("s-dc", "closed", "warnc");
        dc.onmessage = onData;
      }

      async function onData(ev) {
        if (typeof ev.data === "string") {
          const m = JSON.parse(ev.data);
          if (m.type === "file-meta") {
            meta = m; received = 0; chunks = []; t0 = performance.now();
            $("f-name").textContent = m.name;
            $("f-size").textContent = fmt(m.size);
            $("sha").textContent = "…";
            log(`[file] incoming ${m.name} ${fmt(m.size)} sha256=${m.sha256.slice(0,12)}…`);
          } else if (m.type === "file-end") {
            await finish();
          }
          return;
        }
        // binary chunk
        chunks.push(ev.data);
        received += ev.data.byteLength;
        const pct = meta ? received / meta.size : 0;
        $("prog").style.width = (pct * 100).toFixed(1) + "%";
        $("f-recv").textContent = fmt(received);
        const secs = (performance.now() - t0) / 1000;
        if (secs > 0) $("rate").innerHTML = (received / 1048576 / secs).toFixed(1) + ' <span style="font-size:14px">MB/s</span>';
      }

      async function finish() {
        const secs = (performance.now() - t0) / 1000;
        const blob = new Blob(chunks, { type: meta.mime || "application/octet-stream" });
        log(`[file] complete: ${fmt(received)} in ${secs.toFixed(2)}s = ${(received/1048576/secs).toFixed(1)} MB/s`);

        // Verify integrity end-to-end — proves the P2P bytes arrived intact.
        const buf = await blob.arrayBuffer();
        const digest = await crypto.subtle.digest("SHA-256", buf);
        const hex = [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, "0")).join("");
        const ok = hex === meta.sha256;
        pill("s-dc", ok ? "verified" : "CORRUPT", ok ? "ok" : "badc");
        $("sha").innerHTML = ok ? '<span class="accent">✓ match</span>' : '<span style="color:var(--bad)">✗ mismatch</span>';
        log(`[file] sha256 ${ok ? "MATCH" : "MISMATCH"} (${hex.slice(0,16)}…)`);

        const a = document.createElement("a");
        a.className = "dl"; a.href = URL.createObjectURL(blob); a.download = meta.name;
        a.textContent = `⬇ download ${meta.name} (${fmt(received)})`;
        $("dlwrap").innerHTML = ""; $("dlwrap").appendChild(a);
        // Signal to any automated harness that the transfer verified.
        window.__helixP2P = { ok, bytes: received, seconds: secs, mbps: received/1048576/secs, sha256: hex };
      }

      // Read out which ICE candidate pair won — "host"/"prflx" = truly direct;
      // "relay" would mean a TURN box in the middle (not the case here).
      async function reportPath() {
        try {
          const stats = await pc.getStats();
          let pairId = null, local = {}, remote = {};
          stats.forEach((r) => { if (r.type === "transport" && r.selectedCandidatePairId) pairId = r.selectedCandidatePairId; });
          stats.forEach((r) => { if (r.type === "candidate-pair" && (r.id === pairId || (r.selected && !pairId))) { local = stats.get(r.localCandidateId) || {}; remote = stats.get(r.remoteCandidateId) || {}; } });
          const kind = local.candidateType || "?";
          const direct = kind !== "relay";
          pill("s-path", `${kind} → ${remote.candidateType || "?"}${direct ? " (direct P2P)" : " (TURN relay)"}`, direct ? "ok" : "warnc");
          log(`[webrtc] selected path: local=${kind} ${local.address||""} remote=${remote.candidateType||"?"} ${remote.address||""}`);
        } catch (e) { log("[webrtc] getStats failed: " + e); }
      }

      // Poll the EC2 signaling byte counter so we can watch it stay tiny while
      // the file flows P2P.
      function pollStats(room, signalUrl) {
        if (statsTimer) return;
        const httpBase = signalUrl.replace(/^ws/, "http").replace(/\/__p2p__.*$/, "");
        statsTimer = setInterval(async () => {
          try {
            const r = await (await fetch(httpBase + "/__p2pstats__")).json();
            const mine = (r.rooms || []).find((x) => x.id === room);
            if (mine) $("sigbytes").textContent = fmt(mine.signalingBytesRelayed);
          } catch {}
        }, 1000);
      }
    </script>
  </body>
</html>
