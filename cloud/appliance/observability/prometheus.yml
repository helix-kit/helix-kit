# Appliance Prometheus — all targets are localhost (single container). blackbox
# is dropped (add it back if you bake its binary in). cadvisor runs in raw
# cgroup mode (per-systemd-service metrics, not per-docker-container) and
# mosquitto-exporter is vendored into the image — both included below.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["127.0.0.1:9090"] }]
  - job_name: node-exporter
    static_configs: [{ targets: ["127.0.0.1:9100"] }]
  - job_name: postgres
    static_configs: [{ targets: ["127.0.0.1:9187"] }]
  - job_name: redis
    static_configs: [{ targets: ["127.0.0.1:9121"] }]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs: [{ targets: ["127.0.0.1:9644"] }]
  - job_name: helix-server
    metrics_path: /metrics
    static_configs: [{ targets: ["127.0.0.1:9464"] }]
  - job_name: otel-collector
    static_configs: [{ targets: ["127.0.0.1:8889"] }]
  - job_name: alloy
    static_configs: [{ targets: ["127.0.0.1:12345"] }]
  - job_name: mosquitto
    static_configs: [{ targets: ["127.0.0.1:9234"] }]
  - job_name: cadvisor
    static_configs: [{ targets: ["127.0.0.1:9338"] }]
