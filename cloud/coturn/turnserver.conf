# Helix TURN relay (coturn) — static policy.
#
# TURN is the fallback path for the WebRTC data plane: when a device and a browser
# cannot find a direct route (symmetric NAT, a corporate VPN that blocks UDP),
# their DataChannel/media traffic is relayed through here instead of failing.
# Direct paths are always preferred — a relayed session costs cloud bandwidth,
# the very thing P2P exists to avoid.
#
# The deployment-specific lines (listening/relay/external IPs, the TLS cert, the
# auth secret and realm) are APPENDED at start by cloud/coturn/entrypoint.sh
# (compose) and cloud/appliance/bin/coturn-prepare.sh (appliance/AMI). coturn does
# not expand environment variables in its config, so they cannot live here.

listening-port=3478
tls-listening-port=5349

# The relay port range. These MUST be open in the firewall/security group, or
# allocation succeeds and then no bytes ever flow — a uniquely confusing failure.
min-port=49160
max-port=49259

fingerprint

# Authentication is ephemeral, HMAC-signed REST credentials (`use-auth-secret`,
# with static-auth-secret appended at start).
#
# Clients get no shared password: /api/ice-config mints a short-lived credential
# per authenticated user — username "<expiry-unix>:<userId>", password
# base64(HMAC-SHA1(secret, username)) — which coturn verifies with the same secret.
# Credentials expire on their own, so a leaked one is worthless within minutes and
# there is nothing to revoke.
#
# A static `user=helix:...` line (as this file once had) is an OPEN RELAY on a
# public box: anyone reading this repo could relay their own traffic through the
# instance on our bandwidth bill. Do not reintroduce one.
use-auth-secret

server-name=helix-turn

# Peer policy. A TURN server relays wherever the client asks, so an unrestricted
# one is a confused deputy: a client could aim it at the instance's own subnet, at
# loopback services, or at the cloud metadata endpoint (169.254.169.254) to read
# instance credentials. Deny every non-routable range — real WebRTC peers are on
# public addresses.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=240.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# No admin/telnet surface.
no-cli
log-file=stdout
