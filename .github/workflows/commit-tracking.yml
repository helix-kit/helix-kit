name: Commit tracking

# Enforce that every change references its Linear tracking issue (HELIX-<number>).
# On github.com there are no server-side git hooks, so this Action is the
# enforcement point — it is a REQUIRED status check (with "require a pull request
# before merging") in the branch ruleset for `main`. The repo squash-merges, so
# the PR title is what lands on `main`; the check validates the PR title.

on:
  pull_request:

permissions:
  contents: read

jobs:
  linear-id:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require Linear tracking id
        env:
          LINEAR_PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-linear-id.sh
