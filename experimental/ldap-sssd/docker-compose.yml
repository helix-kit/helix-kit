name: helix-ldap-experiment

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-helix}
      POSTGRES_USER: ${POSTGRES_USER:-helix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-password}
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-helix} -d ${POSTGRES_DB:-helix}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [helix]

  helix-ldap:
    build:
      context: .
      dockerfile: docker/ldap/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://helix:dev-only-password@postgres:5432/helix?sslmode=disable}
      LDAP_LISTEN_ADDR: ${LDAP_LISTEN_ADDR:-:3389}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-dc=helix,dc=local}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-cn=sssd,dc=helix,dc=local}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-dev-only-password}
      LDAP_SEARCH_LIMIT: ${LDAP_SEARCH_LIMIT:-1000}
      HELIX_HOME_ROOT: ${HELIX_HOME_ROOT:-/home}
      HELIX_LOGIN_SHELL: ${HELIX_LOGIN_SHELL:-/usr/libexec/helix/session-launcher}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LDAP_WIRE_TRACE: ${LDAP_WIRE_TRACE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    # Published only so a developer can point ldapsearch at it from the host.
    ports:
      - "127.0.0.1:${LDAP_HOST_PORT:-23389}:3389"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3389"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [helix]

  sssd-client:
    build:
      context: .
      dockerfile: docker/sssd-client/Dockerfile
    environment:
      SSSD_DEBUG_LEVEL: ${SSSD_DEBUG_LEVEL:-2}
    depends_on:
      helix-ldap:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "getent passwd alice >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [helix]

networks:
  helix:
    driver: bridge
