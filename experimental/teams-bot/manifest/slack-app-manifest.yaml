# Slack app manifest for the Helix chat-bot prototype (Socket Mode).
#
# Create the app from this: https://api.slack.com/apps -> "Create New App" ->
# "From an app manifest" -> pick your workspace -> paste this YAML -> Create.
#
# Socket Mode needs no public URL and no request-URL verification, so this
# manifest applies cleanly with no server running yet. After creating:
#   1. "Basic Information" -> App-Level Tokens -> Generate a token with the
#      connections:write scope  ->  copy it (xapp-...)  ->  SLACK_APP_TOKEN
#   2. "Install App" -> Install to workspace -> copy Bot User OAuth Token
#      (xoxb-...)  ->  SLACK_BOT_TOKEN
#   3. Put both in .env, restart the bot; it connects over the socket.
display_information:
  name: Helix (dev)
  description: Helix device notifications and commands (prototype).
  background_color: "#2563eb"
features:
  bot_user:
    display_name: helix
    always_online: true
  app_home:
    # Required for users to DM the app — off by default, which shows
    # "Sending messages to this app has been turned off".
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
    home_tab_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
      - im:read
      - im:write
      - channels:history
      - groups:history
      - mpim:history
      - reactions:read
      - users:read
      - users:read.email
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
      - message.channels
      - message.groups
      - reaction_added
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
