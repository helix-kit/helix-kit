#
# Identity only. There is no auth_provider and no PAM service: SSSD is used here
# purely as the Linux-side identity broker and cache in front of the LDAP facade.

[sssd]
config_file_version = 2
services = nss
domains = helix

[nss]
# Keep the negative cache short so the e2e "user deleted from PostgreSQL" and
# "user added to PostgreSQL" checks observe the change promptly.
entry_negative_timeout = 1

[domain/helix]
id_provider = ldap

ldap_uri = ldap://helix-ldap:3389
ldap_search_base = dc=helix,dc=local

ldap_user_search_base = ou=People,dc=helix,dc=local
ldap_group_search_base = ou=Groups,dc=helix,dc=local

ldap_schema = rfc2307

ldap_user_object_class = posixAccount
ldap_user_name = uid
ldap_user_uid_number = uidNumber
ldap_user_gid_number = gidNumber
ldap_user_home_directory = homeDirectory
ldap_user_shell = loginShell
ldap_user_gecos = gecos

ldap_group_object_class = posixGroup
ldap_group_name = cn
ldap_group_gid_number = gidNumber

ldap_default_bind_dn = cn=sssd,dc=helix,dc=local
ldap_default_authtok_type = password
ldap_default_authtok = dev-only-password

# The facade speaks plain LDAP on a private compose network. TLS/StartTLS is an
# explicitly deferred production concern for this experiment.
ldap_id_use_start_tls = false
ldap_referrals = false

# Tuned for the e2e outage test: detect the facade going away quickly, and come
# back online quickly once it returns, instead of sitting in the default backoff.
ldap_network_timeout = 3
ldap_opt_timeout = 5
offline_timeout = 5
offline_timeout_max = 15

enumerate = false
cache_credentials = false
