# Type-checking for the device-side Python packages.
#
# These live outside the root mypy run (see pyproject.toml [tool.mypy].exclude):
# they target CPython 3.10 (the device runtime), are installed per-service with
# their own import roots (`<pkg>/src`), and would otherwise collide in the root
# run's module map (the same file resolvable as both `helix_service_runtime` and
# `linux.device.python.helix_service_runtime.src.helix_service_runtime`).
#
# Run via `helix lint python`, which invokes mypy with this config.

[mypy]
python_version = 3.10
strict = True
# Each package is a src-layout: the import root is <pkg>/src.
mypy_path = helix_service_runtime/src:helix_echo/src
# Third-party stubs are not vendored for the device runtime.
ignore_missing_imports = True
# Generated bindings are emitted by `helix protocol generate-all`, not hand-typed;
# tests are exercised by pytest rather than strictly annotated.
exclude = (?x)( /generated/ | /tests/ | /build/ | /dist/ )

# Belt-and-suspenders with the path exclude above: first-party code imports the
# generated module, so mypy would otherwise follow and check it.
[mypy-helix_echo.generated.*]
ignore_errors = True
