persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
autosave_interval 300
persistent_client_expiration 1d
max_queued_messages 200
max_queued_bytes 10485760

plugin_load device_acl /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/device.acl
plugin_load service_acl /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/service.acl

# Device MQTT over TLS
listener 8883
protocol mqtt
listener_allow_anonymous false
require_certificate true
use_identity_as_username true
plugin_use device_acl
cafile /mosquitto/certs/root_ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
# Enforce device-cert revocation via step-ca's CRL (kept fresh by the entrypoint).
crlfile /mosquitto/certs/crl.pem
tls_version tlsv1.2

# Service MQTT over TLS. Internal services with long-lived, directly-issued
# certs — no CRL enforcement here.
listener 8884
protocol mqtt
listener_allow_anonymous false
require_certificate true
use_identity_as_username true
plugin_use service_acl
cafile /mosquitto/certs/root_ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# 1 MB message size limit (WebRTC SDP payloads can be large)
message_size_limit 1048576
