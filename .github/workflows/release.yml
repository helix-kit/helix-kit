# Publishing the @helix-hq packages to npm.
#
# Deliberately NOT on push. Pushing `main` already deploys the site, and an npm
# publish cannot be undone (only deprecated), so releasing is a separate,
# explicit act. Run it from the Actions tab or `gh workflow run release.yml`.
#
# Versions and changelogs come from the changesets accumulated since the last
# release (`web/.changeset/*.md`); if there are none, the run stops before
# publishing anything.
name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Validate and version, but do not publish or push'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit and tags
      id-token: write # npm provenance attestation
    # NPM_TOKEN lives on this environment, alongside the deploy secrets. Without
    # this block `secrets.NPM_TOKEN` silently resolves to an empty string and npm
    # answers an unauthenticated PUT with a 404, which reads like a registry
    # problem rather than a missing credential.
    environment:
      name: Production
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets reads history to work out what changed since the last
          # release; a shallow clone hides it.
          fetch-depth: 0
          # Checked out with the release PAT so the later `git push` is
          # authenticated as its owner. GITHUB_TOKEN cannot push to `main`: the
          # ruleset requires a pull request and bypasses only the admin role, and
          # the first-party Actions app cannot be added as a bypass actor.
          # Falls back to the job token for dry runs, which never push.
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      # Before any work, and before the version bump is committed: a real
      # release that reaches `changeset publish` without a token has already
      # spent five minutes and rewritten every package.json for nothing.
      - name: Check the credentials
        if: inputs.dry-run == false
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          failed=false
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN is empty. It must be a granular access token with" \
              "read+write on the @helix-hq scope and 'bypass 2FA' enabled, set on the" \
              "Production environment (repository-level secrets are not visible here)."
            failed=true
          else
            echo "Publishing to npm as: $(NODE_AUTH_TOKEN="$NPM_TOKEN" npm whoami)"
          fi
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is empty. It must be a fine-grained PAT with" \
              "Contents: read+write on this repository, owned by an account with the admin" \
              "role so it bypasses the branch ruleset, set on the Production environment."
            failed=true
          fi
          [ "$failed" = "false" ] || exit 1

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Is there anything to release?
        id: pending
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "No changesets pending — nothing to release."
          else
            echo "$count changeset(s) pending."
          fi

      # Only the packages. The Next apps need production env to build and are
      # already gated by the deploy pipeline on every push; a release has no
      # business building them.
      - name: Build the packages
        if: steps.pending.outputs.count != '0'
        run: pnpm exec turbo run build --filter='./packages/*'

      # ---- Gates. A release is the one moment these genuinely matter. --------
      - name: Lint & typecheck
        if: steps.pending.outputs.count != '0'
        run: pnpm exec turbo run lint typecheck --filter='./packages/*'

      - name: API contracts
        if: steps.pending.outputs.count != '0'
        run: pnpm api:check

      - name: Packaging (publint + are-the-types-wrong)
        if: steps.pending.outputs.count != '0'
        run: pnpm publint

      # ---- Version, publish, record. ----------------------------------------
      - name: Apply versions and changelogs
        if: steps.pending.outputs.count != '0'
        run: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The version bump changes package.json files, so dist must be rebuilt
      # from them before anything is packed.
      - name: Rebuild at the release version
        if: steps.pending.outputs.count != '0'
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec turbo run build --filter='./packages/*'

      - name: Summarise
        if: steps.pending.outputs.count != '0'
        run: |
          {
            echo '### Releasing'
            echo
            echo '| Package | Version |'
            echo '| --- | --- |'
            node -e "
              const { readdirSync, readFileSync, existsSync } = require('node:fs');
              for (const dir of readdirSync('packages')) {
                const file = \`packages/\${dir}/package.json\`;
                if (!existsSync(file)) continue;
                const pkg = JSON.parse(readFileSync(file, 'utf8'));
                if (pkg.private || !pkg.name.startsWith('@helix-hq/')) continue;
                console.log(\`| \${pkg.name} | \${pkg.version} |\`);
              }
            "
          } >> "$GITHUB_STEP_SUMMARY"

      # Committed before publishing, not after: `changeset publish` tags HEAD,
      # so if the version bump is still uncommitted the tags land on the
      # previous commit and point at the wrong tree.
      - name: Commit the version bump
        if: steps.pending.outputs.count != '0' && inputs.dry-run == false
        run: |
          git config user.name 'Hardik Jain'
          git config user.email 'jainhardik120@gmail.com'
          git add -A
          git commit -s -m "HELIX-203: release @helix-hq packages [skip ci]" || echo 'nothing to commit'

      # Not `changeset publish`: it shells out to `pnpm publish`, and pnpm has
      # no provenance support, so the first release published with no
      # attestation despite NPM_CONFIG_PROVENANCE being set. This packs with
      # pnpm (which resolves `workspace:^`) and publishes the tarball with npm,
      # which does support it.
      - name: Publish
        if: steps.pending.outputs.count != '0' && inputs.dry-run == false
        run: pnpm publish:packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Last, so a failed publish leaves `main` untouched and the run can simply
      # be retried rather than unpicked.
      - name: Push the version commit and tags
        if: steps.pending.outputs.count != '0' && inputs.dry-run == false
        run: git push --follow-tags origin HEAD:main
