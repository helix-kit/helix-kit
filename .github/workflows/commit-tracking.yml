name: Commit tracking

# Enforce that every change references its Linear tracking issue (HELIX-<number>).
# On github.com there are no server-side git hooks, so this Action is the
# enforcement point — make it a REQUIRED status check (with "require a pull
# request before merging") in the branch ruleset for `main` so it actually blocks.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linear-id:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require Linear tracking id
        env:
          LINEAR_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          LINEAR_HEAD_REF: ${{ github.event.pull_request.head.sha || github.event.after }}
          LINEAR_PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check-linear-id.sh
