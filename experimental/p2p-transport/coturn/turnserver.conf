# Helix experimental TURN relay (coturn) for the P2P transport.
#
# TURN is the *fallback* for peers that cannot establish a direct path — e.g. a
# machine on a corporate VPN that blocks UDP and only allows outbound TCP/TLS.
# For those peers the data is relayed through this box (so it DOES use EC2
# bandwidth), unlike the direct P2P path which bypasses EC2 entirely. ICE still
# prefers host/srflx (direct) and only falls back to relay when it must.
#
# Listeners (host network): 3478 udp/tcp (STUN+TURN), 5349 tcp/udp (TURN/TLS).
# TLS reuses Caddy's *.port.helix-kit.com wildcard cert (mounted read-only).
# entrypoint.sh appends listening-ip / relay-ip / external-ip at start.

listening-port=3478
tls-listening-port=5349

# UDP relay port range the far peer sends media/data to — must be open in the
# EC2 security group (udp 49160-49259).
min-port=49160
max-port=49259

fingerprint
lt-cred-mech
user=helix:helixsecret
realm=helix-kit.com
server-name=helix-turn

# TURN/TLS cert — Caddy's already-issued wildcard for *.port.helix-kit.com,
# valid for turn.port.helix-kit.com (single label). caddy_data mounted at /certs.
cert=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/wildcard_.port.helix-kit.com/wildcard_.port.helix-kit.com.crt
pkey=/certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/wildcard_.port.helix-kit.com/wildcard_.port.helix-kit.com.key

# Harden a public relay: don't let clients relay to the instance's own private
# network / AWS metadata / link-local (SSRF). Peers are public IPs only.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

log-file=stdout
no-cli
