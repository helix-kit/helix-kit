# Helix minimal AMI cloud-init policy.
#
# cloud-init runs only as boot-time oneshots (zero steady-state RAM). Its job
# here is narrow: inject the launch SSH key, grow the root partition/fs to fill
# the EBS volume, and set the hostname. Networking is owned by systemd-networkd,
# not cloud-init.

datasource_list: [ Ec2, None ]

# IMDS over IPv6. An IPv6-only instance (no public IPv4 — see `helix ami launch
# --ipv6-only`) has no IPv4 stack at all, so the usual link-local IMDS endpoint
# at 169.254.169.254 is unreachable and cloud-init would silently fail to inject
# the launch SSH key — leaving a box nobody can log into. AWS exposes IMDS at
# fd00:ec2::254 for exactly this, but it must be (a) enabled on the instance
# (`--metadata-options HttpProtocolIpv6=enabled`) and (b) tried by cloud-init.
# Both endpoints are listed so the same image still works on a dual-stack launch.
datasource:
  Ec2:
    metadata_urls:
      - http://[fd00:ec2::254]
      - http://169.254.169.254
    max_wait: 120
    timeout: 10

network:
  config: disabled

disable_root: true
preserve_hostname: false

system_info:
  default_user:
    name: helix
    gecos: Helix
    shell: /bin/bash
    groups: [sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]

# Keep the module set tight — the SSH key + volume growth, nothing else heavy.
cloud_init_modules:
  - migrator
  - seed_random
  - growpart
  - resizefs
  - set_hostname
  - update_hostname
  - users_groups
  - ssh

cloud_config_modules:
  - ssh_import_id
  - set_passwords

cloud_final_modules:
  - final_message
